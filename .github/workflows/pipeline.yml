name: Primer Pipeline CI
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar código fuente
        run: ./mvnw clean compile -B

  test:
    name: Pruebas Unitarias y Cobertura
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas y generar cobertura
        run: ./mvnw test -B

      - name: Publicar reporte de pruebas (Surefire)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-pruebas-unitarias
          path: target/surefire-reports/
          retention-days: 5

      - name: Publicar reporte de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 5