name: Laboratorio 4 - Pipeline CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar código fuente
        run: mvn clean compile -B

      - name: Construir proyecto con Maven
        run: mvn -B package --file pom.xml


  test:
    name: Pruebas Unitarias y Cobertura
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Ejecutar pruebas y generar cobertura
        run: mvn test -B

      - name: Ejecutar cobertura de código con Maven
        run: mvn -B test jacoco:report --file pom.xml

      - name: Publicar reporte de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-pruebas-unitarias
          path: target/surefire-reports/
          retention-days: 5

      - name: Publicar reporte de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 5
